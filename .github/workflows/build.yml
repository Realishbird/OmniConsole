name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libudev-dev libdbus-1-dev \
            libssl-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Rust tests
        if: matrix.name == 'linux-x64'
        working-directory: src-tauri
        run: cargo test

      - name: Build
        shell: bash
        run: |
          args="--target ${{ matrix.target }}"
          if [ -n "${{ matrix.bundles }}" ]; then args="$args --bundles ${{ matrix.bundles }}"; fi
          npx tauri build $args

      - name: Name the installers by version and platform
        id: name
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          out=installers
          mkdir -p "$out"
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          for f in "$bundle"/nsis/*.exe "$bundle"/msi/*.msi "$bundle"/dmg/*.dmg "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage; do
            [ -e "$f" ] || continue
            ext="${f##*.}"
            cp "$f" "$out/OmniConsole-$version-${{ matrix.name }}.$ext"
          done
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: OmniConsole-${{ steps.name.outputs.version }}-${{ matrix.name }}
          if-no-files-found: error
          path: installers/*
