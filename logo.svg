<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0c1322"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <!-- the O: a ring of links between nodes -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="url(#ring)" stroke-width="54" stroke-linecap="round" stroke-dasharray="1570 316" stroke-dashoffset="-160" transform="rotate(-70 512 512)"/>
  <!-- nodes on the ring -->
  <circle cx="512" cy="212" r="46" fill="#eaf4ff"/>
  <circle cx="772" cy="662" r="46" fill="#eaf4ff"/>
  <circle cx="252" cy="662" r="46" fill="#eaf4ff"/>
  <!-- prompt inside -->
  <path d="M400 410 L520 512 L400 614" fill="none" stroke="#eaf4ff" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M560 628 H660" fill="none" stroke="#5eead4" stroke-width="62" stroke-linecap="round"/>
</svg>
