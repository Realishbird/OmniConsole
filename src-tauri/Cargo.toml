[package]
name = "omniconsole"
version = "0.10.0"
description = "OmniConsole: SSH, Telnet and serial console client for network engineers"
authors = ["Realishbird"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "omniconsole_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
# ring instead of aws-lc-rs: no cmake/nasm needed on Windows ARM and Linux ARM builds
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2", "des"] }
serialport = "4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
log = "0.4"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
similar = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
russh-sftp = "3"
aes-gcm = "0.11"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
rand = "0.8"

[profile.release]
codegen-units = 1
lto = true
strip = true

[dev-dependencies]
tempfile = "3"
