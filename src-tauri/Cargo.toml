[package]
name = "omniconsole"
version = "0.1.0"
description = "OmniConsole: SSH, Telnet and serial console client for network engineers"
authors = ["Realishbird"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "omniconsole_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
# ring instead of aws-lc-rs: no cmake/nasm needed on Windows ARM and Linux ARM builds
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2", "des"] }
serialport = "4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
strip = true
